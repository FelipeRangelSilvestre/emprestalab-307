<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel - EmprestaLab 307</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header id="menu"></header>

  <main class="container py-4">
    <div id="alerta"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">Painel de empréstimos</h1>
      <a href="novo-emprestimo.html" class="btn btn-dark">+ Novo empréstimo</a>
    </div>

    <div class="row g-3">
      <div class="col-md-4">
        <div class="coluna-painel border-top border-primary border-4">
          <h2 class="h6">Ativos <span id="qtdAtivos" class="badge text-bg-primary">0</span></h2>
          <div id="colAtivos" class="lista-scroll"></div>
        </div>
      </div>
      <div class="col-md-4" id="atrasados">
        <div class="coluna-painel border-top border-danger border-4">
          <h2 class="h6">Atrasados <span id="qtdAtrasados" class="badge text-bg-danger">0</span></h2>
          <div id="colAtrasados" class="lista-scroll"></div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="coluna-painel border-top border-success border-4">
          <h2 class="h6">Devolvidos <span id="qtdDevolvidos" class="badge text-bg-success">0</span></h2>
          <div id="colDevolvidos" class="lista-scroll"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Alerta ao abrir o sistema (RF12) -->
  <div class="modal fade" id="modalAtrasados" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title">Prazos vencidos</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="listaModalAtrasados"></div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Ok, entendi</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/painel.js"></script>
</body>
</html>
