<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - EmprestaLab 307</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="container d-flex align-items-center justify-content-center tela-login">
    <div class="card shadow-sm" style="width: 100%; max-width: 380px;">
      <div class="card-body p-4">
        <h1 class="h4 text-center mb-1">EmprestaLab 307</h1>
        <p class="text-center text-muted small mb-4">Controle de empréstimos do Lab 307 – ICET/UFAM</p>

        <form id="formLogin">
          <div class="mb-3">
            <label class="form-label" for="email">E-mail</label>
            <input type="email" class="form-control" id="email" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="senha">Senha</label>
            <input type="password" class="form-control" id="senha" required>
          </div>
          <div id="erro" class="alert alert-danger py-2 d-none"></div>
          <button type="submit" class="btn btn-dark w-100">Entrar</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // Se já estiver logado, vai direto para o painel
    if (getToken()) location.href = 'painel.html';

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const erro = document.getElementById('erro');
      erro.classList.add('d-none');
      try {
        const dados = await api('/auth/login', 'POST', {
          email: document.getElementById('email').value,
          senha: document.getElementById('senha').value,
        });
        localStorage.setItem('token', dados.token);
        localStorage.setItem('usuario', JSON.stringify(dados.usuario));
        location.href = 'painel.html';
      } catch (err) {
        erro.textContent = err.message;
        erro.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
