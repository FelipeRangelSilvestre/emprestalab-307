<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peças - EmprestaLab 307</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header id="menu"></header>

  <main class="container py-4">
    <div id="alerta"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">Peças</h1>
      <button class="btn btn-dark" onclick="abrirForm()">+ Nova peça</button>
    </div>

    <input type="search" id="busca" class="form-control mb-3" placeholder="Buscar por nome ou categoria...">

    <div class="card">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Nome</th><th>Categoria</th><th>Descrição</th>
              <th class="text-center">Total</th><th class="text-center">Disponível</th><th class="text-end">Ações</th>
            </tr>
          </thead>
          <tbody id="tabela"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="modal fade" id="modalForm" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="form">
        <div class="modal-header">
          <h5 class="modal-title" id="tituloForm">Nova peça</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="id">
          <div class="mb-2">
            <label class="form-label" for="nome">Nome *</label>
            <input class="form-control" id="nome" required maxlength="100">
          </div>
          <div class="mb-2">
            <label class="form-label" for="categoria">Categoria *</label>
            <input class="form-control" id="categoria" required maxlength="50" list="categorias" placeholder="Placas, Sensores...">
            <datalist id="categorias"></datalist>
          </div>
          <div class="mb-2">
            <label class="form-label" for="descricao">Descrição</label>
            <textarea class="form-control" id="descricao" rows="2"></textarea>
          </div>
          <div class="mb-2">
            <label class="form-label" for="quantidade_total">Quantidade total *</label>
            <input type="number" class="form-control" id="quantidade_total" required min="0" step="1">
            <div class="form-text" id="infoEmprestadas"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-dark">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pecas.js"></script>
</body>
</html>
