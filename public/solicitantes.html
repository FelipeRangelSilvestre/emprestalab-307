<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitantes - EmprestaLab 307</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header id="menu"></header>

  <main class="container py-4">
    <div id="alerta"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">Solicitantes</h1>
      <button class="btn btn-dark" onclick="abrirForm()">+ Novo solicitante</button>
    </div>

    <input type="search" id="busca" class="form-control mb-3" placeholder="Buscar por nome ou matrícula...">

    <div class="card">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Nome</th><th>Matrícula</th><th>Tipo</th><th>Contato</th><th>Situação</th><th class="text-end">Ações</th>
            </tr>
          </thead>
          <tbody id="tabela"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Formulário de cadastro/edição -->
  <div class="modal fade" id="modalForm" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="form">
        <div class="modal-header">
          <h5 class="modal-title" id="tituloForm">Novo solicitante</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="id">
          <div class="mb-2">
            <label class="form-label" for="nome">Nome *</label>
            <input class="form-control" id="nome" required maxlength="100">
          </div>
          <div class="row">
            <div class="col-sm-6 mb-2">
              <label class="form-label" for="matricula">Matrícula *</label>
              <input class="form-control" id="matricula" required maxlength="20">
            </div>
            <div class="col-sm-6 mb-2">
              <label class="form-label" for="tipo">Tipo *</label>
              <select class="form-select" id="tipo" required>
                <option value="aluno">Aluno</option>
                <option value="professor">Professor</option>
              </select>
            </div>
          </div>
          <div class="mb-2">
            <label class="form-label" for="telefone">Telefone</label>
            <input class="form-control" id="telefone" maxlength="20" placeholder="(92) 99999-9999">
          </div>
          <div class="mb-2">
            <label class="form-label" for="email">E-mail</label>
            <input type="email" class="form-control" id="email" maxlength="100">
          </div>
          <p class="small text-muted mb-0">Informe pelo menos telefone ou e-mail.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-dark">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Histórico -->
  <div class="modal fade" id="modalHistorico" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="tituloHistorico">Histórico</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="corpoHistorico"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/solicitantes.js"></script>
</body>
</html>
