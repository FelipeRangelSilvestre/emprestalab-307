<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitores - EmprestaLab 307</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header id="menu"></header>

  <main class="container py-4">
    <div id="alerta"></div>
    <h1 class="h4 mb-3">Monitores</h1>

    <div class="row g-3">
      <div class="col-lg-5">
        <form class="card" id="form">
          <div class="card-body">
            <h2 class="h6">Cadastrar monitor</h2>
            <div class="mb-2">
              <label class="form-label" for="nome">Nome *</label>
              <input class="form-control" id="nome" required maxlength="100">
            </div>
            <div class="mb-2">
              <label class="form-label" for="email">E-mail *</label>
              <input type="email" class="form-control" id="email" required maxlength="100">
            </div>
            <div class="mb-2">
              <label class="form-label" for="senha">Senha * (mín. 6)</label>
              <input type="password" class="form-control" id="senha" required minlength="6">
            </div>
            <div class="mb-3">
              <label class="form-label" for="perfil">Perfil</label>
              <select class="form-select" id="perfil">
                <option value="monitor">Monitor</option>
                <option value="admin">Administrador</option>
              </select>
            </div>
            <button class="btn btn-dark w-100">Cadastrar</button>
          </div>
        </form>
      </div>
      <div class="col-lg-7">
        <div class="card">
          <div class="table-responsive">
            <table class="table mb-0">
              <thead class="table-light"><tr><th>Nome</th><th>E-mail</th><th>Perfil</th></tr></thead>
              <tbody id="tabela"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    iniciarPagina('usuarios.html');
    if (getUsuario()?.perfil !== 'admin') location.href = 'painel.html';

    async function carregar() {
      try {
        const lista = await api('/usuarios');
        document.getElementById('tabela').innerHTML = lista.map((u) => `
          <tr><td>${esc(u.nome)}</td><td>${esc(u.email)}</td><td>${esc(u.perfil)}</td></tr>`).join('');
      } catch (err) {
        mostrarMsg(err.message, 'danger');
      }
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await api('/usuarios', 'POST', {
          nome: document.getElementById('nome').value,
          email: document.getElementById('email').value,
          senha: document.getElementById('senha').value,
          perfil: document.getElementById('perfil').value,
        });
        e.target.reset();
        mostrarMsg('Monitor cadastrado');
        carregar();
      } catch (err) {
        mostrarMsg(err.message, 'danger');
      }
    });

    carregar();
  </script>
</body>
</html>
