<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novo empréstimo - EmprestaLab 307</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header id="menu"></header>

  <main class="container py-4">
    <div id="alerta"></div>
    <h1 class="h4 mb-3">Novo empréstimo</h1>

    <div class="row g-3">
      <!-- Esquerda: escolher solicitante e peças -->
      <div class="col-lg-7">
        <div class="card mb-3">
          <div class="card-body">
            <h2 class="h6">1. Solicitante</h2>
            <div id="solicitanteEscolhido" class="d-none"></div>
            <div id="areaBuscaSolicitante">
              <input type="search" id="buscaSolicitante" class="form-control" placeholder="Digite nome ou matrícula...">
              <div id="resultadoSolicitante" class="list-group resultado-busca mt-2"></div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <h2 class="h6">2. Peças</h2>
            <input type="search" id="buscaPeca" class="form-control" placeholder="Digite nome ou categoria...">
            <div id="resultadoPeca" class="list-group resultado-busca mt-2"></div>
          </div>
        </div>
      </div>

      <!-- Direita: carrinho -->
      <div class="col-lg-5">
        <div class="card">
          <div class="card-body">
            <h2 class="h6">3. Carrinho</h2>
            <table class="table table-sm align-middle">
              <thead><tr><th>Peça</th><th class="text-center">Qtd</th><th></th></tr></thead>
              <tbody id="carrinho"></tbody>
            </table>

            <div class="mb-2">
              <label class="form-label" for="prazo">Data de devolução *</label>
              <input type="date" id="prazo" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="observacao">Observação</label>
              <textarea id="observacao" class="form-control" rows="2" placeholder="Ex.: projeto de TCC"></textarea>
            </div>
            <button id="btnConfirmar" class="btn btn-dark w-100" onclick="confirmar()">Confirmar empréstimo</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/novo-emprestimo.js"></script>
</body>
</html>
